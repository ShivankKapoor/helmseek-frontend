server {
    listen 3003;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect with a relative Location (/) instead of an absolute URL. By default nginx builds an
    # absolute one from the request's Host header and its own port (3003), which is wrong behind a
    # proxy and echoes back whatever Host the client sent.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Every location includes the security headers itself (see security-headers.conf for why).

    # Long cache for hashed static assets (JS/CSS filenames contain content hash)
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for HTML — ensures users always get the latest app shell
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — unknown paths redirect to root
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        include /etc/nginx/snippets/security-headers.conf;
        return 302 /;
    }
}
