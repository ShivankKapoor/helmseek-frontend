services:
  helmseek-frontend:
    build: .
    image: helmseek-frontend
    container_name: helmseek-frontend
    restart: unless-stopped
    dns:
      - 9.9.9.9
      - 1.1.1.1
    ports:
      - "3003:3003"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "10"
