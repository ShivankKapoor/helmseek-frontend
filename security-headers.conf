# Security headers, included by every location in nginx.conf.
#
# nginx only inherits server-level add_header directives into a location that sets no add_header of
# its own, so a location that adds (say) Cache-Control silently drops the others. Including this file
# explicitly in each location avoids that. `always` sends them on error and redirect responses too.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
